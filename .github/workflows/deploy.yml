name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_WHATSAPP: ${{ secrets.NEXT_PUBLIC_WHATSAPP }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: Deploy to Cloudflare Workers
        # CI DEPLOY NOTE (2026-09-18):
        # `npx opennextjs-cloudflare deploy` and `npx wrangler deploy` both
        # probe /workers/services/{name} before deploying. The probe
        # returns 7003 in some CF regions (including GH Actions runners —
        # YYZ works locally), causing CI deploys to fail with a misleading
        # "Could not route" error even though the upload succeeds.
        #
        # Until CF fixes the regional routing or wrangler handles 7003 like
        # 404 (treat worker as new), deploys from CI will keep failing.
        #
        # Workarounds in priority order:
        #   1. Local deploy: clone repo, run `npm ci && npm run build &&
        #      npx wrangler deploy --domain paragu-ai.com --domain www.paragu-ai.com`
        #      Uses CF_MASTER_TOKEN from BWS.
        #   2. Use scripts/cf-deploy.py (direct CF API, no wrangler probe).
        #      Wired up via a follow-up deploy.yml change.
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
