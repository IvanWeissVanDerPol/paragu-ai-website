name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_WHATSAPP: ${{ secrets.NEXT_PUBLIC_WHATSAPP }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: Deploy to Cloudflare Workers (versions flow)
        # Use opennextjs upload + wrangler versions deploy instead of
        # `wrangler deploy` or `opennextjs-cloudflare deploy`. The latter
        # both hit a /workers/services/{name} probe that returns 7003 in
        # some CF regions, failing CI deploys. The versions flow doesn't
        # probe: it uploads a new version then promotes it.
        run: |
          set -e
          VERSION_OUTPUT=$(npx opennextjs-cloudflare upload 2>&1)
          echo "$VERSION_OUTPUT"
          VERSION_ID=$(echo "$VERSION_OUTPUT" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $NF}')
          if [ -z "$VERSION_ID" ]; then
            echo "ERROR: could not parse Worker Version ID from upload output"
            exit 1
          fi
          echo "Promoting version $VERSION_ID to 100%"
          npx wrangler versions deploy --version-id "$VERSION_ID" --percentage 100 --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
